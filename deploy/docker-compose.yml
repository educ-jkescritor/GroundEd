# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d --build
# Logs: each service keeps at most 3 files of 10 MB, so an unattended server cannot fill its disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DB_PATH: /app/state/grounded.db
    volumes:
      - backend_state:/app/state
    restart: unless-stopped
    logging: *logging
    # Health check is defined in backend/Dockerfile (GET /api/health every 30 s).

  web:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set to your domain (e.g. grounded.example.com or 1-2-3-4.sslip.io) for automatic HTTPS.
      # Leave unset for plain HTTP on port 80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy  # start serving only once the API answers its health check
    restart: unless-stopped
    logging: *logging

volumes:
  backend_state:
  caddy_data:
