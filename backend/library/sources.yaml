# Source library — trusted documents for web development (tiers: docs/design-brief.md §6).
# Build with:  uv run python -m app.cli library build      (writes library/snapshot/, reviewed in a PR)
#
# store:
#   full     — keep the whole main text (licence allows reuse with attribution)
#   excerpt  — keep only passages matching `excerpt_terms` (licence unclear or restrictive: cite, don't copy)
# selector: CSS selector for the page's main content (menus, footers and scripts are dropped).
#
# Licences (checked 2026-11-14): PHP Manual CC BY 3.0 (php.net/copyright.php) · MDN CC BY-SA 2.5 ·
# MySQL Reference Manual © Oracle, all rights reserved · Microsoft Learn: treated as restrictive (excerpt only).

