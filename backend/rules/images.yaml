# Image rules for OCR (reading code screenshots). Data, not code: tune here, then re-run tests and `app.cli eval`.
# Images get the same clean-up idea as text: skip what cannot carry teaching content, read the rest, keep only
# confident text. Everything here is deterministic (same image -> same text).

# 1. Which images are worth reading
min_long_side_px: 150      # icons and bullets: even their longer side is smaller than this
min_area_px: 15000         # ... or too few pixels to hold readable text (a 1-line, 900x100 px snippet is kept)
min_shown_area_pt2: 15000   # images displayed tinier than ~120x120 pt on the page are decoration
repeated_fraction: 0.5      # an image on >= half of the pages ...
background_page_fraction: 0.4   # ... that also covers >= 40% of the page is a slide background (a reused code
                                #     screenshot is smaller and is kept)
only_pages_with_text_below: 400   # pages that already have this much real text rarely hide code in images

# 2. Limit per analysis. A fixed COUNT (first N worth reading, in page order), never a time budget: the same PDF
#    must read the same images on a fast laptop or a 2-CPU server, first run or tenth (results are cached by image
#    fingerprint, which only makes it faster). ~1.4 s per image on 2 CPU cores -> 30 images ~ 45 s worst case.
max_images: 30
max_side_px: 1600           # larger images are scaled down first

# 3. Which OCR lines to keep
min_confidence: 0.80
same_line_overlap: 0.5      # OCR fragments whose heights overlap by >= 50% are one visual line: merged left->right
drop_lines:                 # whole lines that are noise in code screenshots
  - '^\s*\d{1,4}\s*$'       # editor line numbers
strip_leading: '^[^\x20-\x7E]+'   # fold markers/icons misread as symbols at the start of a line ("白<center>")
