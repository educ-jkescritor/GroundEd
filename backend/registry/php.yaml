# Facts Registry — PHP language features. Every fact = a library document + a verbatim quote from it.
# Code checks the quote against library/snapshot/<doc>.json; dates come from the endoflife.date snapshot.
# Schema: backend/app/registry.py (Entry). Reviewed via PR; never edited by the LLM.
- id: php-ext-mysql
  technology: PHP mysql extension (mysql_* functions)
  patterns:
    - '\bmysql_[a-z_]+\s*\('
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "7.0"}
    doc: php-migration70-incompatible
    quote: "All ext/mysql functions were removed. For details about choosing a different MySQL API, see Choosing a MySQL API."
  upgrade:
    target: mysqli or PDO (with prepared statements)
    source_url: https://www.php.net/manual/en/mysqlinfo.api.choosing.php

- id: php-asp-script-tags
  technology: ASP-style and <script language="php"> PHP tags
  patterns:
    - '<%=?'
    - '<script\s+language\s*=\s*["“”'']?php'
  context:  # `<% %>` is normal in EJS (Node.js) and JSP (Java): only flag it on pages that are about PHP
    - '<\?php'
    - '\bphp\b'
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "7.0"}
    doc: php-migration70-incompatible
    quote: "Support for using ASP and script tags to delimit PHP code has been removed."
  upgrade:
    target: "Standard <?php ... ?> tags"
    source_url: https://www.php.net/manual/en/language.basic-syntax.phptags.php

- id: php-ext-ereg
  technology: PHP POSIX regex (ereg* functions)
  patterns:
    - '\beregi?(_replace)?\s*\('
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "7.0"}
    doc: php-migration70-incompatible
    quote: "All ereg functions were removed. PCRE is a recommended alternative."
  upgrade:
    target: PCRE preg_* functions
    source_url: https://www.php.net/manual/en/book.pcre.php

# ---------------------------------------------------------------- Track B (2026-11-15)
- id: php-each
  technology: PHP each() function
  # each($array): the $ argument and the negative look-behinds keep jQuery's $.each(...) and "for each (" out.
  patterns: ['(?<![.\w$>])(?<!for )\beach\s*\(\s*\$']
  context: ['<\?php', '\bphp\b']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "8.0"}
    doc: php-migration80-incompatible
    quote: "each() has been removed. foreach or ArrayIterator should be used instead."
  upgrade: {target: "foreach loops", source_url: "https://www.php.net/manual/en/migration80.incompatible.php"}

- id: php-create-function
  technology: PHP create_function()
  patterns: ['\bcreate_function\s*\(']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "8.0"}
    doc: php-migration80-incompatible
    quote: "create_function() has been removed. Anonymous functions may be used instead."
  upgrade: {target: "Anonymous functions (closures)", source_url: "https://www.php.net/manual/en/migration80.incompatible.php"}

- id: php-functions-removed-8
  technology: PHP functions removed in 8.0 (money_format, get_magic_quotes_gpc, fgetss, …)
  patterns: ['\b(?:money_format|get_magic_quotes_gpc|get_magic_quotes_runtime|fgetss|convert_cyr_string|hebrevc|restore_include_path|ezmlm_hash)\s*\(']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "8.0"}
    doc: php-migration80-incompatible
    quote: "The following functions have been removed: hebrevc() convert_cyr_string() money_format() ezmlm_hash() restore_include_path() get_magic_quotes_gpc() get_magic_quotes_runtime() fgetss()"

- id: php-ext-mcrypt
  technology: PHP mcrypt extension (mcrypt_* functions)
  patterns: ['\bmcrypt_[a-z0-9_]+\s*\(']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "7.2"}
    doc: php-migration72-other-changes
    quote: "The MCrypt extension has now been moved out of the core to PECL. Given the mcrypt library has not seen any updates since 2007, its usage is highly discouraged. Instead, either the OpenSSL or Sodium extension should be used."
  upgrade: {target: "OpenSSL or Sodium extension", source_url: "https://www.php.net/manual/en/migration72.other-changes.php"}

- id: php-utf8-encode
  technology: PHP utf8_encode() / utf8_decode()
  patterns: ['\butf8_(?:en|de)code\s*\(']
  fact:
    stage: deprecated
    product: php
    cycle: "8.2"
    doc: php-migration82-deprecated
    quote: "utf8_encode() and utf8_decode() have been deprecated."
  upgrade: {target: "mb_convert_encoding()", source_url: "https://www.php.net/manual/en/migration82.deprecated.php"}

# ---------------------------------------------------------------- Track B round 2: PHP 5.4 removals (2026-11-15)
- id: php-register-globals
  technology: PHP register_globals / $HTTP_*_VARS long arrays
  # register_long_arrays was the directive that provided $HTTP_GET_VARS, $HTTP_POST_VARS, ...
  patterns:
    - '\bregister_(?:globals|long_arrays)\b'
    - '\$HTTP_(?:GET|POST|COOKIE|SERVER|ENV|SESSION|POST_FILES)_VARS\b'
  context: ['<\?php', '\bphp\b', '\$_(?:GET|POST|SERVER)\b']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "5.4"}
    doc: php5-migration54-incompatible
    quote: "The register_globals and register_long_arrays php.ini directives have been removed."
  upgrade: {target: "$_GET, $_POST, $_SERVER superglobals", source_url: "https://php-legacy-docs.zend.com/manual/php5/en/migration54.incompatible"}

- id: php-magic-quotes
  technology: PHP magic quotes
  patterns:
    - '\bmagic_quotes_(?:gpc|runtime|sybase)\b'
    - '\bset_magic_quotes_runtime\s*\('
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "5.4"}
    doc: php5-migration54-incompatible
    quote: "Magic quotes has been removed. Applications relying on this feature may need to be updated, to avoid security issues."
  upgrade: {target: "Prepared statements / context-specific escaping", source_url: "https://www.php.net/manual/en/mysqlinfo.api.choosing.php"}

- id: php-session-register
  technology: PHP session_register() / session_unregister() / session_is_registered()
  patterns: ['\bsession_(?:register|unregister|is_registered)\s*\(']
  fact:
    stage: eol
    product: php
    removed_in: {product: php, cycle: "5.4"}
    doc: php5-migration54-incompatible
    quote: "The following functions have been removed from PHP: define_syslog_variables() import_request_variables() session_is_registered(), session_register() and session_unregister()."
  upgrade: {target: "$_SESSION with session_start()", source_url: "https://php-legacy-docs.zend.com/manual/php5/en/migration54.incompatible"}
