# Facts Registry — PHP language features. Every entry needs an official source and a verbatim quote from it.
# Schema: backend/app/registry.py (Entry). Reviewed via PR; never edited by the LLM.
- id: php-ext-mysql
  technology: PHP mysql extension (mysql_* functions)
  patterns:
    - '\bmysql_[a-z_]+\s*\('
  fact:
    stage: eol
    product: php
    eol_date: "2015-12-03"  # PHP 7.0.0 release, which removed ext/mysql
    source_name: PHP Manual (php.net) — Backward incompatible changes in PHP 7.0
    source_url: https://www.php.net/manual/en/migration70.incompatible.php
    source_quote: "All ext/mysql functions were removed. For details about choosing a different MySQL API, see Choosing a MySQL API."
  upgrade:
    target: mysqli or PDO (with prepared statements)
    source_url: https://www.php.net/manual/en/mysqlinfo.api.choosing.php

- id: php-asp-script-tags
  technology: ASP-style and <script language="php"> PHP tags
  patterns:
    - '<%=?'
    - '<script\s+language\s*=\s*["“”'']?php'
  context:  # `<% %>` is normal in EJS (Node.js) and JSP (Java): only flag it on pages that are about PHP
    - '<\?php'
    - '\bphp\b'
  fact:
    stage: eol
    product: php
    eol_date: "2015-12-03"
    source_name: PHP Manual (php.net) — Backward incompatible changes in PHP 7.0
    source_url: https://www.php.net/manual/en/migration70.incompatible.php
    source_quote: "Support for using ASP and script tags to delimit PHP code has been removed. The affected tags are: <% %> <%= %> <script language=\"php\"> </script>"
  upgrade:
    target: "Standard <?php ... ?> tags"
    source_url: https://www.php.net/manual/en/language.basic-syntax.phptags.php

- id: php-ext-ereg
  technology: PHP POSIX regex (ereg* functions)
  patterns:
    - '\beregi?(_replace)?\s*\('
  fact:
    stage: eol
    product: php
    eol_date: "2015-12-03"
    source_name: PHP Manual (php.net) — Backward incompatible changes in PHP 7.0
    source_url: https://www.php.net/manual/en/migration70.incompatible.php
    source_quote: "All ereg* functions All ereg functions were removed. PCRE is a recommended alternative."
  upgrade:
    target: PCRE preg_* functions
    source_url: https://www.php.net/manual/en/book.pcre.php
