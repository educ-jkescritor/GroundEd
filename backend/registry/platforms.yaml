# Facts Registry — products whose lifecycle comes live from endoflife.date (v1 API).
# `eol.product` / `eol.cycle` name the endoflife.date product and release; dates are never written here.
- id: windows-7
  technology: Windows 7
  patterns: ['\bWindows\s*7\b']
  eol: {product: windows, cycle: "7"}
  upgrade: {target: Windows 11, source_url: "https://endoflife.date/windows"}

- id: windows-8
  technology: Windows 8
  patterns: ['\bWindows\s*8(?!\.\d)\b']
  eol: {product: windows, cycle: "8"}
  upgrade: {target: Windows 11, source_url: "https://endoflife.date/windows"}

- id: windows-8-1
  technology: Windows 8.1
  patterns: ['\bWindows\s*8\.1\b']
  eol: {product: windows, cycle: "8.1"}
  upgrade: {target: Windows 11, source_url: "https://endoflife.date/windows"}

- id: windows-10
  technology: Windows 10
  patterns: ['\bWindows\s*10\b']
  eol: {product: windows, cycle: "10-22h2"}  # last consumer release; support ended 2025-10-14
  upgrade: {target: Windows 11, source_url: "https://endoflife.date/windows"}

- id: internet-explorer
  technology: Internet Explorer
  patterns:
    - '\bInternet\s+Explorer(?:[ \t]+v?(?P<v>\d+))?\b'
    - '\b(?:MSIE|IE)[ \t]?(?P<v>[5-9]|1[01])\b'
  eol: {product: internet-explorer, cycle: "11"}  # no version written: IE 11, the last release
  upgrade: {target: Microsoft Edge, source_url: "https://learn.microsoft.com/lifecycle/faq/internet-explorer-microsoft-edge"}
