# Facts Registry — deprecated HTML elements. Source: MDN Web Docs (Mozilla), CC BY-SA 2.5.
# Each element's own MDN page is the document; the quote is MDN's deprecation statement on that page.
# Patterns need the literal tag ("<center"), so prose like "center the text" or CSS text-align never matches.

- id: html-center
  technology: HTML <center> element
  patterns: ['<center\b']
  fact:
    stage: deprecated
    product: html
    doc: mdn-center
    quote: "This tag has been deprecated in HTML 4 (and XHTML 1) in favor of the CSS text-align property, which can be applied to the <div> element or to an individual <p>."
  upgrade: {target: "CSS text-align", source_url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/center"}

- id: html-font
  technology: HTML <font> element
  patterns: ['<font\b']
  fact:
    stage: deprecated
    product: html
    doc: mdn-font
    quote: "Avoid using this feature in new projects. This feature may be a candidate for removal from web standards or browsers."
  upgrade: {target: "CSS font properties", source_url: "https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/font"}

